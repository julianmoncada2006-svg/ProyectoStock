<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Sistema de inventario</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f3f6;
            padding: 30px;
        }

        h1 {
            color: #243b55;
        }

        .contenedor {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        button {
            background: #243b55;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #243b55;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Sistema de inventario</h1>

    <div class="contenedor">

        <h2>Agregar producto</h2>

        <form action="/agregar" method="post">

            <input type="text"
                   name="nombre"
                   placeholder="Nombre del producto"
                   required>

            <input type="number"
                   name="cantidad"
                   placeholder="Cantidad"
                   min="0"
                   required>

            <input type="number"
                   name="precio"
                   placeholder="Precio"
                   min="0"
                   step="0.01"
                   required>

            <button type="submit">
                Registrar producto
            </button>

        </form>

        <h2>Productos registrados</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio</th>
            </tr>

            <tr th:each="p : ${productos}">

                <td th:text="${p.id}"></td>
                <td th:text="${p.nombre}"></td>
                <td th:text="${p.cantidad}"></td>
                <td th:text="${p.precio}"></td>

            </tr>

        </table>

        <h3>
            Valor total del inventario:
            $<span th:text="${total}"></span>
        </h3>

    </div>

</body>
</html>
